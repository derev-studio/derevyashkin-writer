<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в админку - Александр Деревяшкин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  [data-theme="light"]  { --bg:#faf8f5;--bg2:#f5f2ed;--bg3:#ede8e0;--a1:#8b5cf6;--a2:#a78bfa;--adim:rgba(139,92,246,0.08);--brd:rgba(139,92,246,0.15);--tx:#2d3748;--mu:#718096;--glow:rgba(139,92,246,0.05);--bt:#faf8f5; }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:'Jost',sans-serif;font-weight:300;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

  .login-container{max-width:400px;width:100%;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:32px;text-align:center}
  h1{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--tx);margin-bottom:16px}
  .subtitle{color:var(--mu);margin-bottom:24px}
  
  .form-group{margin-bottom:16px;text-align:left}
  label{display:block;color:var(--mu);font-size:0.8rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
  input{width:100%;background:var(--bg3);border:1px solid var(--brd);color:var(--tx);padding:12px;border-radius:4px;font-family:inherit;font-size:0.9rem}
  
  .btn{width:100%;padding:12px;background:var(--a1);color:var(--bt);border:none;border-radius:4px;font-weight:500;cursor:pointer;transition:all 0.3s;text-transform:uppercase;letter-spacing:0.05em;font-size:0.8rem}
  .btn:hover{background:var(--a2);transform:translateY(-1px)}
  
  .error{background:#ef4444;color:white;padding:12px;border-radius:4px;margin-bottom:16px}
  .hidden{display:none}
  
  /* Стили для основной админки */
  .container{max-width:800px;margin:0 auto;width:100%}
  .form-section{background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:24px;margin-bottom:20px}
  textarea{min-height:120px;resize:vertical}
  .success{background:#10b981;color:white;padding:12px;border-radius:4px;margin-bottom:16px}
  .works-list{display:grid;gap:16px}
  .work-item{background:var(--bg3);border:1px solid var(--brd);padding:16px;border-radius:4px}
  .work-info h3{color:var(--tx);margin-bottom:4px}
  .work-info p{color:var(--mu);font-size:0.8rem}
  .work-actions{display:flex;gap:8px;margin-top:12px}
  .btn-small{padding:6px 12px;font-size:0.7rem}
</style>
</head>
<body>

<!-- Форма входа -->
<div class="login-container" id="loginForm">
  <h1>🔐 Админка</h1>
  <p class="subtitle">Только для автора</p>
  
  <div id="loginError" class="error hidden">Неверный пароль</div>
  
  <form onsubmit="checkPassword(event)">
    <div class="form-group">
      <label for="password">Пароль</label>
      <input type="password" id="password" required placeholder="Введите пароль">
    </div>
    <button type="submit" class="btn">Войти</button>
  </form>
</div>

<!-- Основная админка (скрыта) -->
<div id="adminPanel" class="hidden">
  <div class="container">
    <h1>📝 Админка</h1>
    
    <div class="form-section">
      <h2>Добавить произведение</h2>
      <form id="workForm">
        <div class="form-group">
          <label for="title">Название</label>
          <input type="text" id="title" required>
        </div>
        
        <div class="form-group">
          <label for="genre">Жанр</label>
          <select id="genre">
            <option value="Романтика">Романтика</option>
            <option value="Проза">Проза</option>
            <option value="Психология">Психология</option>
            <option value="Приключения">Приключения</option>
            <option value="Юмор">Юмор</option>
            <option value="Фантастика">Фантастика</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="description">Описание</label>
          <textarea id="description" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="cover">Обложка произведения</label>
          <input type="file" id="coverFile" accept="image/*" onchange="previewImage(event)">
          <div id="imagePreview" style="margin-top:10px;"></div>
          <input type="hidden" id="cover" placeholder="URL обложки">
        </div>
        
        <div class="form-group">
          <label for="link">Ссылка на чтение</label>
          <input type="url" id="link" placeholder="https://...">
        </div>
        
        <div class="form-group">
          <label for="free">Бесплатное произведение</label>
          <select id="free">
            <option value="false">Нет</option>
            <option value="true">Да</option>
          </select>
        </div>
        
        <button type="submit" class="btn">Добавить произведение</button>
      </form>
    </div>

    <div class="form-section">
      <h2>Мои произведения</h2>
      <div class="works-list" id="worksList">
        <!-- Произведения будут загружаться сюда -->
      </div>
    </div>
  </div>
</div>

<script>
// Проверка пароля
function checkPassword(event) {
  event.preventDefault();
  const password = document.getElementById('password').value;
  
  if (password === 'derev2025') { // Пароль: derev2025
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    loadWorks();
  } else {
    document.getElementById('loginError').classList.remove('hidden');
    setTimeout(() => {
      document.getElementById('loginError').classList.add('hidden');
    }, 3000);
  }
}

// Предпросмотр изображения
function previewImage(event) {
  const file = event.target.files[0];
  const preview = document.getElementById('imagePreview');
  const coverInput = document.getElementById('cover');
  
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      preview.innerHTML = `<img src="${e.target.result}" style="max-width:200px;height:auto;border-radius:4px;border:1px solid var(--brd)">`;
      coverInput.value = e.target.result; // Сохраняем base64
    };
    reader.readAsDataURL(file);
  }
}

// Загрузка произведений из localStorage
function loadWorks() {
  const works = JSON.parse(localStorage.getItem('myWorks') || '[]');
  const list = document.getElementById('worksList');
  
  if (works.length === 0) {
    list.innerHTML = '<p style="color: var(--mu); text-align: center;">Пока нет произведений</p>';
    return;
  }
  
  list.innerHTML = works.map((work, index) => `
    <div class="work-item">
      <div style="display:flex;gap:16px;align-items:center">
        ${work.cover ? `<img src="${work.cover}" style="width:60px;height:80px;object-fit:cover;border-radius:4px">` : '<div style="width:60px;height:80px;background:var(--bg3);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mu)">📖</div>'}
        <div class="work-info">
          <h3>${work.title}</h3>
          <p>${work.genre} • ${work.free ? 'Бесплатно' : 'Платно'}</p>
        </div>
      </div>
      <div class="work-actions">
        <button class="btn btn-small" onclick="editWork(${index})">Редактировать</button>
        <button class="btn btn-small" style="background: #ef4444" onclick="deleteWork(${index})">Удалить</button>
      </div>
    </div>
  `).join('');
}

// Добавление произведения
document.getElementById('workForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const work = {
    title: document.getElementById('title').value,
    genre: document.getElementById('genre').value,
    description: document.getElementById('description').value,
    cover: document.getElementById('cover').value,
    link: document.getElementById('link').value,
    free: document.getElementById('free').value === 'true',
    date: new Date().toLocaleDateString('ru-RU')
  };
  
  const works = JSON.parse(localStorage.getItem('myWorks') || '[]');
  works.push(work);
  localStorage.setItem('myWorks', JSON.stringify(works));
  
  // Показать уведомление
  showNotification('Произведение добавлено!', 'success');
  
  // Очистить форму
  this.reset();
  
  // Обновить список
  loadWorks();
});

// Удаление произведения
function deleteWork(index) {
  if (confirm('Удалить это произведение?')) {
    const works = JSON.parse(localStorage.getItem('myWorks') || '[]');
    works.splice(index, 1);
    localStorage.setItem('myWorks', JSON.stringify(works));
    loadWorks();
    showNotification('Произведение удалено', 'success');
  }
}

// Показ уведомлений
function showNotification(message, type) {
  const div = document.createElement('div');
  div.className = type;
  div.textContent = message;
  document.querySelector('.container').insertBefore(div, document.querySelector('.form-section'));
  
  setTimeout(() => div.remove(), 3000);
}

// Начальная загрузка
loadWorks();
</script>

</body>
</html>
